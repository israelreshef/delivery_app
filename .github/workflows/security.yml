name: 🛡️ Enterprise Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Block merge on any finding

      - name: 🔍 Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/javascript
            p/react
        # Block on High/Critical findings

      - name: 🐍 Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r backend/ -ll -ii
        # -ll: medium/high severity, -ii: medium/high confidence

      - name: 📦 pip-audit (Python SCA)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict
        # Block on any critical vulnerability

      - name: 🧪 npm audit (Node SCA)
        run: |
          cd frontend
          npm audit --audit-level=critical

      - name: 🛡️ OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

  dast-scan:
    name: DAST Analysis (Staging)
    needs: security-scan
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: 🕸️ OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://staging.tzir-delivery.co.il' # Placeholder for actual staging URL
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
