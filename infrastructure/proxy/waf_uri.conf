# Edge WAF rules — included from inside a `server { }` block.
# Operates on URI + query + headers (PCRE, `if` + `return` only — safe pattern).
# Deep JSON body inspection runs in-app (backend/utils/request_waf.py).

# ---- body / buffer caps ---------------------------------------------------
client_max_body_size 100m;
client_body_buffer_size 1m;
client_header_buffer_size 8k;
large_client_header_buffers 4 16k;

# ---- SQL injection ---------------------------------------------------------
if ($request_uri ~* "(union(\s+(all|distinct))?\s+select|\bselect\b[^\n;]{0,80}\bfrom\b|insert\s+into|drop\s+(table|database)|xp_cmdshell)") {
    return 403;
}
if ($request_uri ~* "(\bor\b|\band\b)\s+[0-9]+\s*[=<>]\s*[0-9]+") {
    return 403;
}
if ($request_uri ~* "(/\*.*\*/|--\s*$|;%0a|\b0x[0-9a-f]{4,}\b)") {
    return 403;
}

# ---- Cross-site scripting ---------------------------------------------------
if ($request_uri ~* "(<\s*script|</\s*script|javascript\s*:|<\s*iframe|<object\s|<embed\s)") {
    return 403;
}
if ($request_uri ~* "(\bon\w+\s*=\s*['\"]{0,1}\s*(alert|eval|document\.cookie|prompt))") {
    return 403;
}

# ---- Path traversal / file access -------------------------------------------
if ($request_uri ~* "(\.\./|\.\.\\|%2e%2e|/etc/passwd|/proc/self|windows[\\/]system32)") {
    return 403;
}

# ---- Cleanup / probe tooling -------------------------------------------------
if ($request_uri ~* "(sqlmap|nikto|nessus|acunetix|burp_collector|nmap_scan)") {
    return 403;
}