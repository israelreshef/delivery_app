# Local dev stack: edge WAF proxy (nginx) -> Flask backend -> Redis.
# Usage: `docker compose up -d` after placing self-signed certs in ./certs.
services:
  waf:
    image: nginx:1.27-alpine
    container_name: tzir-waf
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./waf_uri.conf:/etc/waf/waf_uri.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ../../backend
    container_name: tzir-backend
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${SECRET_KEY}}
      DATABASE_URL: ${DATABASE_URL:-postgresql://delivery_user:delivery_pass@db:5432/delivery_db}
      REDIS_URL: redis://redis:6379/0
      SECURITY_WAF_ENABLED: "true"
    expose:
      - "5000"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tzir-redis
    expose:
      - "6379"
    restart: unless-stopped