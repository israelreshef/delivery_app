[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov=routes --cov=utils --cov=sockets --cov-report=term-missing --cov-report=xml:coverage.xml --ignore=tests/test_result.txt"

[tool.coverage.run]
branch = true
source = ["app", "routes", "utils", "sockets"]

[tool.coverage.report]
skip_empty = true
